decisioniq:
  rag:
    vector-store:
      uri: http://localhost:19530
      collectionName: decisioniq_supported_capabilities
      token:
  assistant:
    data-slices:
      TRANSACTION_DECISION_SLICE:
        description: Core case, transaction context, and final decision facts.
        tables:
          decision_cases:
            fields:
              - case_id
              - correlation_id
              - customer_ref
              - account_ref
              - event_time
              - decision_name
              - scenario_type
              - source_system
          transaction_context:
            fields:
              - amount
              - currency
              - transaction_type
              - channel
              - merchant_id
              - merchant_name
              - merchant_category
              - beneficiary_id
              - device_id
              - transaction_country
              - transaction_city
          decision_outcomes:
            fields:
              - decision_action
      DECISION_EXPLANATION_SLICE:
        description: Evidence used to explain why the final decision happened.
        tables:
          decision_outcomes:
            fields:
              - decision_action
          model_outputs:
            fields:
              - model_id
              - score_name
              - score
              - risk_band
          rule_evaluations:
            fields:
              - rule_name
              - rule_meaning
              - status
              - decision_candidate
          decision_reason_codes:
            fields:
              - reason_order
              - reason_text
          risk_signals:
            fields:
              - known_device
              - known_beneficiary
              - known_merchant
              - international_transaction
              - odd_hour
              - authentication_method
              - failed_login_count_last_hour
              - amount_above_balance
      DECISION_CASE_SLICE:
        description: Case identifiers and decision scenario metadata for the transaction.
        tables:
          decision_cases:
            fields:
              - case_id
              - correlation_id
              - customer_ref
              - account_ref
              - event_time
              - decision_name
              - scenario_type
              - source_system
      TRANSACTION_CONTEXT_SLICE:
        description: Transaction amount, channel, merchant, beneficiary, device, and location context.
        tables:
          transaction_context:
            fields:
              - amount
              - currency
              - transaction_type
              - channel
              - merchant_id
              - merchant_name
              - merchant_category
              - beneficiary_id
              - device_id
              - transaction_country
              - transaction_city
      DECISION_OUTCOME_SLICE:
        description: Final decision outcome for the transaction.
        tables:
          decision_outcomes:
            fields:
              - decision_action
      MODEL_SCORE_SLICE:
        description: Model score and risk band produced for the transaction.
        tables:
          model_outputs:
            fields:
              - model_id
              - score_name
              - score
              - risk_band
      RULE_EVALUATION_SLICE:
        description: Rules evaluated for the transaction and the candidate decision they produced.
        tables:
          rule_evaluations:
            fields:
              - rule_name
              - rule_meaning
              - status
              - decision_candidate
      REASON_CODE_SLICE:
        description: Ordered reason codes explaining the decision.
        tables:
          decision_reason_codes:
            fields:
              - reason_order
              - reason_text
      RISK_SIGNAL_SLICE:
        description: Risk and trust signals observed for the transaction.
        tables:
          risk_signals:
            fields:
              - known_device
              - known_beneficiary
              - known_merchant
              - international_transaction
              - odd_hour
              - authentication_method
              - failed_login_count_last_hour
              - amount_above_balance
      CUSTOMER_CONTEXT_SLICE:
        description: Customer profile and historical risk snapshot captured for the transaction.
        tables:
          customer_context_snapshot:
            fields:
              - customer_ref
              - customer_type
              - segment
              - risk_tier
              - country
              - preferred_channel
              - avg_transaction_amount
              - historical_chargeback_count
              - historical_decline_count
              - historical_fraud_count
              - usual_hour_start
              - usual_hour_end
      ACCOUNT_CONTEXT_SLICE:
        description: Account age and balance snapshot captured for the transaction.
        tables:
          account_context_snapshot:
            fields:
              - account_ref
              - account_age_days
              - account_balance_snapshot
              - available_balance_snapshot
      DMP_TRACE_SLICE:
        description: Decision management platform trace metadata linked to the transaction.
        tables:
          dmp_traces:
            fields:
              - trace_id
              - correlation_id
              - producer
              - model_id
              - started_at
              - completed_at
      GENERATED_FEATURE_SLICE:
        description: Generated model features used during decisioning.
        tables:
          generated_features:
            fields:
              - feature_group
              - feature_name
              - feature_value
      EVALUATION_TRUTH_SLICE:
        description: Offline evaluation labels and expected outcomes for validation workflows.
        tables:
          evaluation_truth:
            fields:
              - expected_action
              - expected_consistency
              - expected_risk_band
              - ground_truth_label
